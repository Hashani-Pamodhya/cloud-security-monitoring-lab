services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    ports:
      - "127.0.0.1:9200:9200"
      - "192.168.56.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
      - "192.168.56.1:5601:5601"
    depends_on:
      - elasticsearch

  prometheus:
    image: prom/prometheus
    volumes:
      - "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "127.0.0.1:3000:3000"

  victim:
    build: ./lab/victim
    hostname: victim
    networks:
      - labnet
    volumes:
      - victim-logs:/var/log

  kali:
    image: kalilinux/kali-rolling
    command: sleep infinity
    networks:
      - labnet

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./lab/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - victim-logs:/victim-logs:ro
    depends_on:
      - elasticsearch
      - victim
    networks:
      - labnet

volumes:
  esdata:
  victim-logs:

networks:
  labnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
    driver_opts:
      com.docker.network.bridge.name: br-soclab
